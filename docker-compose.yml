services:
  bmw-cardata-imou:
    build: .
    container_name: bmw-cardata-imou
    env_file:
      - .env
    volumes:
      - bmw-cardata-state:/data
      - type: bind
        source: /var/lib/rpi-observability/bmw-cardata-imou
        target: /metrics
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  bmw-cardata-state:
