name: Deploy Raspberry Pi

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy application to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_SSH_PORT || '21' }}
          username: ${{ secrets.PI_USER }}
          password: ${{ secrets.PI_SSH_PASSWORD }}
          source: "app,scripts,Dockerfile,docker-compose.yml,requirements.txt,.dockerignore,.env.example,README.md"
          target: ${{ secrets.PI_DEPLOY_PATH }}

      - name: Rebuild and restart service
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_SSH_PORT || '21' }}
          username: ${{ secrets.PI_USER }}
          password: ${{ secrets.PI_SSH_PASSWORD }}
          script: |
            set -eu
            cd "${{ secrets.PI_DEPLOY_PATH }}"
            docker compose up -d --build --remove-orphans
            docker compose ps
